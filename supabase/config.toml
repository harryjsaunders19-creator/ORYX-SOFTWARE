# ORYX local Supabase (CLI) — used for e2e / local Postgres Path A.
# Migrations live in supabase/migrations/; seed applies after db reset/start.

project_id = "oryx-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 10000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed-e2e-users.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"

[realtime]
enabled = false

[analytics]
enabled = false
