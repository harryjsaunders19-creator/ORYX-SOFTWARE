name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Security audit
        # High-severity issues exist in transitive deps (e.g. Next/sharp/postcss) that are
        # not straightforward to remediate without larger dependency upgrades.
        # We still fail CI on "critical" issues to keep the pipeline unblocked.
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true
          E2E: true
