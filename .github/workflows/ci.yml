name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Security audit
        # Fail on high+ so transitive advisories stay visible in CI.
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin to avoid intermittent GitHub API rate limits on `latest`.
          version: 2.110.0

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start local Supabase for e2e
        run: node scripts/e2e-supabase-up.mjs

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: E2E tests (Supabase)
        run: |
          set -a
          # shellcheck disable=SC1091
          source .env.e2e
          set +a
          npm run test:e2e
        env:
          CI: true
          E2E: true
          FORCE_SUPABASE_ONLY: true
          AUTH_SECRET: e2e-auth-secret-not-for-production
          ALLOW_BOOTSTRAP_TEST_ACCOUNTS: "true"

      - name: Stop Supabase
        if: always()
        run: supabase stop || true
