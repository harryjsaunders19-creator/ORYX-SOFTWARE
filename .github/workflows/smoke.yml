name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1-5"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Smoke /api/ping
        env:
          PRODUCTION_URL: https://oryx-software.vercel.app
        run: npm run smoke:production
